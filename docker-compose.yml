# ModAgent 生产部署（云服务器 + Docker Compose）
# 用法：
#   1. cp deploy/.env.example .env && 编辑 .env（必填 AUTH_PASSWORD / LLM_API_KEY）
#   2. docker compose up -d --build
#   3. 浏览器访问 http://服务器IP
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      - AUTH_PASSWORD=${AUTH_PASSWORD:?必须在 .env 设置访问密码}
      - LLM_API_KEY=${LLM_API_KEY:?必须在 .env 设置 LLM API Key}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # HTTPS 升级后取消注释（certbot 生成证书后）：
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书挂载（certbot 生成后）：
      # - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
